name: Repair TypeScript compile error

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix matrix determinant type error
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/index.tsx')
          s = p.read_text(encoding='utf-8')
          old = "case'matrix':q=`2×2 determinant = ${fmt(x*z-y*c)}`;break;"
          new = "case'matrix':q=`2×2 determinant = ${fmt(x*z-y*n(c))}`;break;"
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Commit repair if needed
        shell: bash
        run: |
          if git diff --quiet -- app/index.tsx; then
            echo "No repair needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.tsx
          git commit -m "fix: resolve matrix calculator TypeScript type error"
          git push
