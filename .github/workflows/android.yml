name: Android APK and AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Repair known TypeScript issues
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/index.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace("case'matrix':q=`2×2 determinant = ${fmt(x*z-y*c)}`;break;", "case'matrix':q=`2×2 determinant = ${fmt(x*z-y*n(c))}`;break;")
          s = s.replace(')*c)} kcal/day', ')*n(c)} kcal/day')
          p.write_text(s, encoding='utf-8')
          PY
          if ! git diff --quiet -- app/index.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/index.tsx
            git commit -m "fix: resolve calculator TypeScript numeric coercion"
            git push
          fi

      - name: TypeScript check
        run: npm run typecheck

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smartcalc-ai-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: smartcalc-ai-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
